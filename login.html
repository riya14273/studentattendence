<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Student Management System | Riya Dubey</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top right, rgba(124, 58, 237, 0.12), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(79, 70, 229, 0.15), transparent 40%),
                  var(--bg-body);
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      position: relative;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo-badge {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 1.6rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 16px var(--primary-glow);
    }
    .auth-role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-surface-alt);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      gap: 4px;
    }
    .auth-role-tab {
      padding: 0.55rem;
      text-align: center;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-role-tab.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .password-wrapper {
      position: relative;
    }
    .toggle-pwd-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
    }
    .demo-credentials-box {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      background: var(--primary-light);
      border-radius: var(--radius-md);
      border: 1px dashed var(--primary);
      font-size: 0.82rem;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.35rem;">
          Student Management System
        </h2>
        <p style="font-size: 0.88rem; color: var(--text-muted);">
          Engineered by <strong style="color: var(--primary);">Riya Dubey</strong> &bull; Prayagraj, India
        </p>
      </div>

      <!-- Role Tabs (Student / Admin) -->
      <div class="auth-role-tabs" id="authRoleTabs">
        <div class="auth-role-tab active" data-role="Admin">
          <i class="fas fa-shield-alt"></i> Admin Login
        </div>
        <div class="auth-role-tab" data-role="Student">
          <i class="fas fa-user-graduate"></i> Student Login
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div style="position: relative;">
            <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            <input type="email" id="loginEmail" class="form-control" style="padding-left: 2.6rem;" value="riya.dubey@student.edu.in" required placeholder="name@domain.com">
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" id="forgotPwdLink" style="font-size: 0.78rem; color: var(--primary); font-weight: 500;">Forgot Password?</a>
          </div>
          <div class="password-wrapper">
            <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            <input type="password" id="loginPassword" class="form-control" style="padding-left: 2.6rem; padding-right: 2.5rem;" value="riya@2026" required placeholder="Enter password">
            <span class="toggle-pwd-btn" id="togglePasswordBtn">
              <i class="fas fa-eye" id="pwdEyeIcon"></i>
            </span>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" id="rememberMe" checked style="accent-color: var(--primary); cursor: pointer;">
            Keep me signed in
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem;">
          <span>Sign In to Dashboard</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <!-- Quick 1-Click Demo Fill -->
      <div class="demo-credentials-box">
        <div style="font-weight: 600; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.4rem;">
          <i class="fas fa-key" style="color: var(--primary);"></i> One-Click Demo Access
        </div>
        <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.5rem;">
          Preset credentials belong to <strong>Riya Dubey (Admin / Host)</strong>. Click below to autofill and explore.
        </p>
        <button type="button" class="btn btn-secondary btn-sm" id="fillDemoCreds" style="width: 100%;">
          <i class="fas fa-magic"></i> Auto-Fill Riya's Demo Credentials
        </button>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? 
        <a href="javascript:void(0)" id="signupModalBtn" style="color: var(--primary); font-weight: 600;">Create Registration</a>
      </div>
    </div>
  </div>

  <!-- Registration Modal -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fas fa-user-plus" style="color: var(--primary);"></i> Student Registration</h3>
        <i class="fas fa-times modal-close" id="closeRegisterModal"></i>
      </div>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="regName" placeholder="e.g. Riya Dubey" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="regEmail" placeholder="student@college.edu.in" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Course / Program</label>
            <select class="form-control" id="regCourse">
              <option value="B.Tech CSE">B.Tech Computer Science</option>
              <option value="B.Tech IT">B.Tech Information Technology</option>
              <option value="B.Tech ECE">B.Tech Electronics & Comm</option>
              <option value="BCA">Bachelor of Computer App</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Semester</label>
            <select class="form-control" id="regSemester">
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4">Semester 4</option>
              <option value="Semester 5">Semester 5</option>
              <option value="Semester 6" selected>Semester 6</option>
              <option value="Semester 7">Semester 7</option>
              <option value="Semester 8">Semester 8</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="regPhone" placeholder="+91 98765 43210" required>
          </div>
          <div class="form-group">
            <label class="form-label">Create Password</label>
            <input type="password" class="form-control" id="regPassword" placeholder="Min 6 characters" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelRegisterModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Complete Registration</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let activeRole = "Admin";
      const roleTabs = document.querySelectorAll(".auth-role-tab");
      const togglePwdBtn = document.getElementById("togglePasswordBtn");
      const pwdInput = document.getElementById("loginPassword");
      const pwdEyeIcon = document.getElementById("pwdEyeIcon");
      const loginForm = document.getElementById("loginForm");
      const fillDemoBtn = document.getElementById("fillDemoCreds");
      const forgotLink = document.getElementById("forgotPwdLink");

      // Register modal
      const regModal = document.getElementById("registerModal");
      const openRegBtn = document.getElementById("signupModalBtn");
      const closeRegBtn = document.getElementById("closeRegisterModal");
      const cancelRegBtn = document.getElementById("cancelRegisterModal");
      const registerForm = document.getElementById("registerForm");

      // Switch Role tabs
      roleTabs.forEach(tab => {
        tab.addEventListener("click", () => {
          roleTabs.forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          activeRole = tab.getAttribute("data-role");
          showToast(`Switched login view to ${activeRole}`, "info");
        });
      });

      // Toggle Password Visibility
      if (togglePwdBtn && pwdInput) {
        togglePwdBtn.addEventListener("click", () => {
          const type = pwdInput.getAttribute("type") === "password" ? "text" : "password";
          pwdInput.setAttribute("type", type);
          pwdEyeIcon.className = type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
        });
      }

      // Autofill demo
      if (fillDemoBtn) {
        fillDemoBtn.addEventListener("click", () => {
          document.getElementById("loginEmail").value = "riya.dubey@student.edu.in";
          pwdInput.value = "riya@2026";
          showToast("Autofilled Riya Dubey's demo credentials!", "success");
        });
      }

      // Handle Sign In Submit
      if (loginForm) {
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const pass = pwdInput.value;

          if (!email || !pass) {
            showToast("Please provide both email and password", "warning");
            return;
          }

          // Session Auth Token
          sessionStorage.setItem("riya_dubey_sms_auth", JSON.stringify({
            user: "Riya Dubey",
            role: activeRole,
            email: email,
            loginTime: new Date().toISOString()
          }));

          showToast(`Welcome back, Riya Dubey! Signed in as ${activeRole}`, "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 600);
        });
      }

      // Forgot Password demo alert
      if (forgotLink) {
        forgotLink.addEventListener("click", () => {
          showToast("Demo Security: Reset link has been sent to riya.dubey@student.edu.in", "info");
        });
      }

      // Register Modal Events
      if (openRegBtn) openRegBtn.addEventListener("click", () => regModal.classList.add("active"));
      if (closeRegBtn) closeRegBtn.addEventListener("click", () => regModal.classList.remove("active"));
      if (cancelRegBtn) cancelRegBtn.addEventListener("click", () => regModal.classList.remove("active"));

      if (registerForm) {
        registerForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("regName").value;
          const email = document.getElementById("regEmail").value;
          const course = document.getElementById("regCourse").value;
          const semester = document.getElementById("regSemester").value;
          const phone = document.getElementById("regPhone").value;

          const students = AppState.getStudents();
          const newId = "STU-" + (1000 + students.length + 1);
          students.unshift({
            id: newId,
            name, email, phone, course, semester,
            attendance: 100,
            status: "Active",
            avatar: ""
          });
          AppState.saveStudents(students);

          showToast(`Registration completed for ${name}! Please login now.`, "success");
          regModal.classList.remove("active");
          registerForm.reset();
        });
      }
    });
  </script>
</body>
</html>
